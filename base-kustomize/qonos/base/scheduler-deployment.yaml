apiVersion: apps/v1
kind: Deployment
metadata:
  name: qonos-scheduler
  namespace: openstack
  labels:
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/instance: qonos
    app.kubernetes.io/name: qonos
    application: qonos
    component: scheduler
    release_group: qonos
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: scheduler
      app.kubernetes.io/instance: qonos
      app.kubernetes.io/name: qonos
      application: qonos
      component: scheduler
      release_group: qonos
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/component: scheduler
        app.kubernetes.io/instance: qonos
        app.kubernetes.io/name: qonos
        application: qonos
        component: scheduler
        release_group: qonos
    spec:
      serviceAccountName: qonos
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init
          image: ghcr.io/rackerlabs/genestack-images/kubernetes-entrypoint:1771720239
          imagePullPolicy: IfNotPresent
          command:
            - kubernetes-entrypoint
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: INTERFACE_NAME
              value: eth0
            - name: PATH
              value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/
            - name: DEPENDENCY_SERVICE
              value: openstack:keystone-api,openstack:mariadb-cluster-primary,openstack:rabbitmq-nodes
            - name: DEPENDENCY_JOBS
              value: qonos-ks-user
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
        - name: db-sync
          image: ghcr.io/rackerlabs/qonosv2:latest
          imagePullPolicy: Always
          command:
            - /tmp/qonos-db-sync.sh
          env:
            - name: QONOS_CONFIG_FILE
              value: /etc/qonosv2/qonos.conf
            - name: PYTHONPATH
              value: /app
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: qonos-bin
              mountPath: /tmp/qonos-db-sync.sh
              subPath: qonos-db-sync.sh
              readOnly: true
            - name: qonos-etc
              mountPath: /etc/qonosv2/qonos.conf
              subPath: qonos.conf
              readOnly: true
      nodeSelector:
        openstack-control-plane: enabled
      containers:
        - name: scheduler
          image: ghcr.io/rackerlabs/qonosv2:latest
          imagePullPolicy: Always
          command:
            - /tmp/qonos-scheduler.sh
            - start
          env:
            - name: QONOS_CONFIG_FILE
              value: /etc/qonosv2/qonos.conf
            - name: PYTHONPATH
              value: /app
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f "[a]pi.scheduler"
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f "[a]pi.scheduler"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /tmp/qonos-scheduler.sh
                  - stop
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: qonos-bin
              mountPath: /tmp/qonos-scheduler.sh
              subPath: qonos-scheduler.sh
              readOnly: true
            - name: qonos-etc
              mountPath: /etc/qonosv2/qonos.conf
              subPath: qonos.conf
              readOnly: true
      volumes:
        - name: pod-tmp
          emptyDir: {}
        - name: qonos-bin
          configMap:
            name: qonos-bin
            defaultMode: 365
        - name: qonos-etc
          secret:
            secretName: qonos-etc
            defaultMode: 292
