apiVersion: batch/v1
kind: Job
metadata:
  name: qonos-ks-user
  namespace: openstack
  labels:
    app.kubernetes.io/component: ks-user
    app.kubernetes.io/instance: qonos
    app.kubernetes.io/name: qonos
    application: qonos
    component: ks-user
    release_group: qonos
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ks-user
        app.kubernetes.io/instance: qonos
        app.kubernetes.io/name: qonos
        application: qonos
        component: ks-user
        release_group: qonos
    spec:
      restartPolicy: OnFailure
      serviceAccountName: qonos
      securityContext:
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init
          image: ghcr.io/rackerlabs/genestack-images/kubernetes-entrypoint:1771720239
          imagePullPolicy: IfNotPresent
          command:
            - kubernetes-entrypoint
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: INTERFACE_NAME
              value: eth0
            - name: PATH
              value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/
            - name: DEPENDENCY_SERVICE
              value: openstack:keystone-api
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
      nodeSelector:
        openstack-control-plane: enabled
      containers:
        - name: qonos-ks-user
          image: ghcr.io/rackerlabs/genestack-images/openstack-client:latest
          imagePullPolicy: IfNotPresent
          command:
            - /tmp/qonos-ks-user.sh
          env:
            - name: OS_IDENTITY_API_VERSION
              value: "3"
            - name: OS_AUTH_URL
              value: http://keystone-api.openstack.svc.cluster.local:5000/v3
            - name: OS_REGION_NAME
              value: RegionOne
            - name: OS_INTERFACE
              value: internal
            - name: OS_ENDPOINT_TYPE
              value: internal
            - name: OS_PROJECT_DOMAIN_NAME
              value: Default
            - name: OS_PROJECT_NAME
              value: admin
            - name: OS_USER_DOMAIN_NAME
              value: Default
            - name: OS_USERNAME
              value: admin
            - name: OS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keystone-admin
                  key: password
            - name: SERVICE_OS_SERVICE_NAME
              value: qonos
            - name: SERVICE_OS_REGION_NAME
              value: RegionOne
            - name: SERVICE_OS_PROJECT_DOMAIN_NAME
              value: service
            - name: SERVICE_OS_PROJECT_NAME
              value: service
            - name: SERVICE_OS_USER_DOMAIN_NAME
              value: service
            - name: SERVICE_OS_USERNAME
              value: qonos
            - name: SERVICE_OS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qonos-admin
                  key: password
            - name: SERVICE_OS_ROLES
              value: admin
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: qonos-bin
              mountPath: /tmp/qonos-ks-user.sh
              subPath: qonos-ks-user.sh
              readOnly: true
      volumes:
        - name: pod-tmp
          emptyDir: {}
        - name: qonos-bin
          configMap:
            name: qonos-bin
            defaultMode: 0555
